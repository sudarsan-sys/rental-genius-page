<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Trove Systems - Open Graph Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
        }
        
        .logo {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            line-height: 1.2;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 24px;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .description {
            font-size: 20px;
            opacity: 0.8;
            max-width: 800px;
            line-height: 1.4;
        }
        
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,255,255,0.05) 0%, transparent 50%);
            z-index: 1;
        }
        
        .tech-icons {
            position: absolute;
            top: 50px;
            right: 50px;
            display: flex;
            gap: 20px;
            z-index: 1;
        }
        
        .tech-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="tech-icons">
        <div class="tech-icon">💻</div>
        <div class="tech-icon">🖥️</div>
        <div class="tech-icon">🎮</div>
        <div class="tech-icon">⚡</div>
    </div>
    
    <div class="container">
        <div class="logo">
            <div class="logo-text">
                Tech<br>Trove<br>Systems
            </div>
        </div>
        
        <h1 class="title">Premier Laptop Rentals in Chennai</h1>
        <p class="subtitle">25+ Years of Trusted IT Rental Services</p>
        <p class="description">
            Professional laptop, desktop, workstation & server rentals with flexible daily, weekly, and monthly plans for businesses and individuals.
        </p>
    </div>
</body>
</html>
