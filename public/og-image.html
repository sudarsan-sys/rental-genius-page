<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Trove Systems - Open Graph Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .logo-symbol {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        .logo-symbol::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);
            border-radius: 50%;
            top: 20px;
            left: 20px;
        }
        
        .logo-symbol::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 8px;
            top: 40px;
            left: 40px;
            transform: rotate(45deg);
        }
        
        .logo-text {
            text-align: left;
        }
        
        .logo-main {
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        .tech {
            color: #e5e7eb;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .trove {
            color: #3b82f6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .systems {
            font-size: 24px;
            color: #9ca3af;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: #ffffff;
        }
        
        .subtitle {
            font-size: 24px;
            opacity: 0.9;
            margin-bottom: 30px;
            color: #d1d5db;
        }
        
        .description {
            font-size: 18px;
            opacity: 0.8;
            max-width: 800px;
            line-height: 1.4;
            color: #9ca3af;
        }
        
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            z-index: 1;
        }
        
        .tech-icons {
            position: absolute;
            top: 50px;
            right: 50px;
            display: flex;
            gap: 20px;
            z-index: 1;
        }
        
        .tech-icon {
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="tech-icons">
        <div class="tech-icon">💻</div>
        <div class="tech-icon">🖥️</div>
        <div class="tech-icon">🎮</div>
        <div class="tech-icon">⚡</div>
    </div>
    
    <div class="container">
        <div class="logo-container">
            <div class="logo-symbol"></div>
            <div class="logo-text">
                <div class="logo-main">
                    <span class="tech">Tech</span> <span class="trove">Trove</span>
                </div>
                <div class="systems">SYSTEMS</div>
            </div>
        </div>
        
        <h1 class="title">Premier Laptop Rentals in Chennai</h1>
        <p class="subtitle">25+ Years of Trusted IT Rental Services</p>
        <p class="description">
            Professional laptop, desktop, workstation & server rentals with flexible daily, weekly, and monthly plans for businesses and individuals.
        </p>
    </div>
</body>
</html>
